# Suppress warnings when native targets are disabled on the current host.
kotlin.native.ignoreDisabledTargets=true

# Allocate sufficient memory for Kotlin Multiplatform, KSP, and Detekt
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC

# Enable Gradle build optimizations
org.gradle.parallel=true
org.gradle.caching=true

